<!-- Roles dropdown for the top nav, shared by the homepage and role pages.
     Native <details> so it needs no JS; the small script below closes it on
     an outside click. data-cta names stay router-* (PostHog trend continuity;
     $current_url distinguishes which page the click came from). The parent
     header must NOT have overflow-hidden or the open panel gets clipped. -->
<details class="relative role-menu">
  <summary class="list-none cursor-pointer select-none [&::-webkit-details-marker]:hidden {{ navLinkClass | default: "text-brand-100 hover:text-white transition-colors" }}">
    Roles <i class="fas fa-chevron-down text-[10px] ml-0.5"></i>
  </summary>
  <div class="absolute right-0 mt-2 w-60 bg-white rounded-xl border border-gray-200 shadow-lg py-1.5 z-20 text-left">
    <a href="/kubernetes-engineer/" data-cta="router-kubernetes-engineer" class="block px-4 py-2 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand-800">Kubernetes Engineer</a>
    <a href="/aws-specialist/" data-cta="router-aws-specialist" class="block px-4 py-2 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand-800">AWS Specialist</a>
    <a href="/platform-engineer/" data-cta="router-platform-engineer" class="block px-4 py-2 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand-800">Platform Engineer</a>
    <a href="/devops/" data-cta="router-devops" class="block px-4 py-2 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand-800">DevOps Engineer</a>
    <a href="/sre/" data-cta="router-sre" class="block px-4 py-2 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand-800">SRE</a>
    <a href="/ai-engineer/" data-cta="router-ai-engineer" class="block px-4 py-2 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand-800">AI Engineer</a>
    <a href="/engineering-leader/" data-cta="router-engineering-leader" class="block px-4 py-2 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand-800">Engineering Leader</a>
    <div class="border-t border-gray-100 mt-1 pt-1">
      <a href="/resume/" data-cta="router-resume" class="block px-4 py-2 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand-800">The Whole Resume</a>
    </div>
  </div>
</details>
<script>
  document.addEventListener('click', function (e) {
    document.querySelectorAll('details.role-menu[open]').forEach(function (d) {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
  });
</script>
