---
layout: layouts/main.html
---
<header class="container mx-auto px-6 pt-12 pb-2">
    <div class="blog-measure">
        <nav class="mb-10">
            <a href="/blog/" class="text-sm text-gray-500 hover:text-brand-700 transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back to Blog
            </a>
        </nav>
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight leading-tight text-gray-900 mb-3">
            {{ title }}
        </h1>
        <time class="text-sm text-gray-500" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %d, %Y" }}</time>
    </div>
</header>

<!-- Blog Content -->
<main class="container mx-auto px-6 py-10">
    {% if image %}
    <img src="{{ image }}" alt="{{ image_alt | default: '' }}" class="blog-measure block w-full mb-10 rounded-lg" />
    {% endif %}
    <article class="blog-measure blog-content">
        {{ content }}
    </article>
</main>
